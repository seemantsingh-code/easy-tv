[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-tv"
version = "0.1.0"
description = "A configurable, self-hosted natural-language controller for Android TV over ADB."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "easy-tv contributors"}]
dependencies = ["Pillow>=10,<13"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]

[project.scripts]
easy-tv = "easy_tv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easy_tv = ["resources/*.json", "resources/profiles/*.json", "resources/shortcuts/*.shortcut"]
